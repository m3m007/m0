[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-stack"
version = "0.1.0"
description = "Robust multi-agent dev stack on existing Token Plan (main) + Kimi (backup) subscriptions."
requires-python = ">=3.11"
# Runtime deps are the ones already present in the shared venv
# (/home/hermes/.hermes/cache/scratch/oh-venv). Nothing here installs anything:
# openhands-sdk / openhands-tools / litellm / PyYAML / pytest / jsonschema are
# all preinstalled, and a version-skewed SDK+tools pair breaks imports, so the
# pins below are documentation, not a request to pip.
# R5: the documented floor moved from 1.51 to 1.54 because that is the version
# the code is written against: Conversation(stuck_detection_thresholds=...),
# setter-only NeverConfirm, and run() taking no args are 1.54 APIs, and a pin
# naming 1.51 claimed support for an SDK this stack cannot run on.
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
team = [
    "openhands-sdk>=1.54,<2",
    "openhands-tools>=1.54,<2",
    "litellm>=1.104,<2",
]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/smoke_repo is a deliberately-broken fixture repo for the end-to-end
# smoke test: its tests are SUPPOSED to fail until a fixer repairs them, so the
# outer suite must not collect them (norecursedirs keeps `pytest tests/` green).
norecursedirs = ["tests/smoke_repo", ".git", "__pycache__", "runs", "*.egg-info"]
markers = [
    "live: touches a real paid endpoint (deselected unless LIVE=1)",
    "slow: multi-turn agent run, minutes not seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["lib", "router", "fix", "team"]
